context_mix: false
camera_prompt: ""
all_fully_denoised: false
svi_model: # svi is lora model
  model_type: Wan2.1-T2V-1.3B
  lora_path: stable_video_infinity/ckpts/lora_weights.safetensors
  lora_alpha: 1.0
