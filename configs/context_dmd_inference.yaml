wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
sharding_strategy: hybrid_full
lr: 2e-06
lr_critic: 4e-07 # if use lora, then lr should be 1.0e-05
beta1: 0.9
beta2: 0.999
beta1_critic: 0.5
beta2_critic: 0.95
max_grad_norm_generator: 2.0
max_grad_norm_critic: 2.0
fake_pretrain_steps: 0 # train fake model for 10 steps
warmup_steps: 0
data_path: prompts/vidprom_filtered_extended.txt
batch_size: 1
gradient_accumulate: 8
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 50
max_step: 2001
