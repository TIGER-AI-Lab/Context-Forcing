  timestep_shift: 5.0
  local_attn_size: 6 # 12 local latent
  sink_size: 3
  rope_length: 21
  cache_size: 21
  keyframe_interval: 0
  num_new_context_tokens: 1 # sink_size + num_new_context_tokens + local_attn_size = cache_size
  keyframe_sample: sim
num_training_frames: 105 # 20s for 84, 30s for 105, 40s for 126
num_min_training_frames: 84 # at least 10s video roll out, 42 latent
real_score_length: 21 # wanx for 21
context_window: 21
rollout_sample_rule: linear
