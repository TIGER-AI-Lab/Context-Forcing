long: false
teacher_forcing: false
training:
  use_amp: false
text_encoder_cpu_offload: true
real_score_cpu_offload: false
fake_score_cpu_offload: false
generator_score_cpu_offload: false
return_attn_map: false
i2v: false
context_teacher: true
context_teacher_path: 'stable_video_infinity/ckpts/lora_weights.safetensors' 
